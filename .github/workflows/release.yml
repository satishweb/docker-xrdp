name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag"
        required: true
        type: string
      dry_run:
        description: "Build the image without publishing it"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY_DOCKERHUB: docker.io
  REGISTRY_GHCR: ghcr.io
  satishweb/docker-xrdp: satishweb/docker-xrdp
  DOCKERHUB_OWNER: satishweb

jobs:
  gate:
    name: Check the build of the branch
    runs-on: ubuntu-latest
    steps:
      - name: The CI workflow has to have passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Looking for a successful CI run for ${COMMIT}."
          conclusion=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${COMMIT}&status=completed&per_page=20" \
            --jq '[.workflow_runs[].conclusion] | if index("success") then "success" else "none" end')
          if [ "${conclusion}" != "success" ]; then
            echo "::error::The CI workflow did not pass for ${COMMIT}. A release can only be cut from a commit that was built and tested on the branch."
            exit 1
          fi
          echo "The CI workflow passed for ${COMMIT}."

  verify:
    name: Verify the image
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: satishweb/docker-xrdp:verify
          provenance: false

      - name: Scan the image for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: satishweb/docker-xrdp:verify
          format: table
          output: /tmp/trivy.txt
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Show the result of the scan
        if: always()
        run: cat /tmp/trivy.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt

      - name: Test the image
        run: |
          python tests/test-xrdp.py --image satishweb/docker-xrdp:verify

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the GitHub container registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ !inputs.dry_run }}
          tags: |
            ${REGISTRY_DOCKERHUB}/${DOCKERHUB_OWNER}/${satishweb/docker-xrdp}:${GITHUB_REF_NAME}
            ${REGISTRY_DOCKERHUB}/${DOCKERHUB_OWNER}/${satishweb/docker-xrdp}:latest
            ${REGISTRY_GHCR}/${GITHUB_REPOSITORY_OWNER}/${satishweb/docker-xrdp}:${GITHUB_REF_NAME}
            ${REGISTRY_GHCR}/${GITHUB_REPOSITORY_OWNER}/${satishweb/docker-xrdp}:latest
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "The release ${TAG} exists already, its notes are updated."
            gh release edit "${TAG}" --title "${TAG}" --generate-notes
          else
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          fi
