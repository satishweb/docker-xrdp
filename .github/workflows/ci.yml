name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: [self-hosted, dgx2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the image
        run: docker build -t satishweb/docker-xrdp:ci -f Dockerfile .

      - name: Scan the image for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: satishweb/docker-xrdp:ci
          format: table
          output: /tmp/trivy.txt
          scanners: vuln,secret
          # The gate looks at the packages of the operating system, they are
          # the ones the image chooses. The findings of the programs that are
          # part of the image are reported below, they can not be fixed in the
          # image.
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Show the result of the scan
        if: always()
        run: cat /tmp/trivy.txt

      - name: Report the findings of the programs in the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: satishweb/docker-xrdp:ci
          format: table
          output: /tmp/trivy-all.txt
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Show the findings of the programs in the image
        if: always()
        run: cat /tmp/trivy-all.txt

      - name: Generate the bill of materials
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: satishweb/docker-xrdp:ci
          format: cyclonedx
          output: /tmp/sbom.cdx.json

      - name: Upload the bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: /tmp/sbom.cdx.json
          if-no-files-found: error

      - name: Install the test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt

      - name: Run the tests
        run: |
          python tests/test-xrdp.py --image satishweb/docker-xrdp:ci

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Is the dependency graph of the repository available?
        id: graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" >/dev/null 2>&1; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::The dependency graph of the repository is not enabled, the dependencies of the pull request are not reviewed."
          fi

      - name: Review the dependencies of the pull request
        if: steps.graph.outputs.available == 'true'
        uses: actions/dependency-review-action@v4
